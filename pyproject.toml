[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dada-4bar-synthesis"
version = "0.1.0"
description = "Inverse kinematic synthesis of four-bar mechanisms for the DADA engine"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
dada-4bar-synthesis = "dada_4bar_synthesis.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
